spring.application.name=aws-mysql
server.port=${SERVER_PORT:8080}


# =========================================================
# MySQL Database
# =========================================================
spring.config.import=aws-secretsmanager:myapp/prod/db-pass
aws.region=${AWS_REGION:ap-south-1}
spring.datasource.password=${password}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sampledb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:appuser}
#spring.datasource.password=${DB_PASSWORD:apppassword}



spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# Hikari Connection Pool
# =========================================================

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# Actuator
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE



<div class="container">

  <h1>AWS MySQL Application</h1>

  @if (loading) {
    <p>Loading...</p>
  }

  @if (error) {
    <p class="error">{{ error }}</p>
  }

  @if (!loading && !error) {
    <div class="items">

      @for (item of items; track item.id) {
        <div class="item-card">

          <h2>{{ item.name }}</h2>

          @if (item.description) {
            <p>{{ item.description }}</p>
          }

          <small>ID: {{ item.id }}</small>

        </div>
      }

      @if (items.length === 0) {
        <p>No records found.</p>
      }

    </div>
  }

</div>
